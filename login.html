<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecteca</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

    .scanning-line {
      height: 2px;
      background: rgba(204, 43, 43, 0.8);
      box-shadow: 0 0 12px rgba(204, 43, 43, 1);
      position: absolute;
      width: 100%;
      top: 0;
      animation: scan 2.5s linear infinite;
    }
    @keyframes scan {
      0% { top: 0; } 50% { top: 100%; } 100% { top: 0; }
    }
    .pulsing-ring {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(204, 43, 43, 0.3);
      border-radius: 9999px;
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.5; }
    }
    .grain-effect {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0.04;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f0f0f0]">

  <!-- ===== TELA 1: Menu ===== -->
  <div id="tela-menu" class="flex flex-col min-h-screen w-full">
    <div class="bg-[#cc2b2b] p-4 w-full">
      <h1 class="text-white text-2xl font-bold uppercase">CONECTECA</h1>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center gap-5">
      <button onclick="window.location.href='face-id.html'"
        class="bg-[#cc2b2b] text-white w-60 py-4 rounded-lg text-2xl font-bold uppercase cursor-pointer hover:opacity-90 transition-opacity border-none">
        FACE ID
      </button>
      <button onclick="window.location.href='gmail-login.html'"
        class="bg-[#cc2b2b] text-white w-60 py-4 rounded-lg text-2xl font-bold uppercase cursor-pointer hover:opacity-90 transition-opacity border-none">
        LOGIN
      </button>
    </div>
  </div>


  <script>
    let cameraStream = null;

    async function irParaFaceID() {
      document.getElementById('tela-menu').classList.add('hidden');
      document.getElementById('tela-menu').classList.remove('flex');
      document.getElementById('tela-faceid').classList.remove('hidden');
      document.getElementById('tela-faceid').classList.add('flex');

      const status = document.getElementById('status-text');
      const container = document.getElementById('media-container');
      const placeholder = document.getElementById('camera-placeholder');
      status.innerText = "APROXIME-SE DA CÂMERA";
      status.style.color = '#cc2b2b';
      container.classList.remove('border-green-500', 'scale-105');
      placeholder.style.display = '';
      document.querySelector('.scanning-line').style.display = '';
      document.querySelector('.pulsing-ring').style.borderColor = '';

      await iniciarCamera();
    }

    function voltarMenu() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
        document.getElementById('camera-feed').srcObject = null;
      }
      document.getElementById('tela-faceid').classList.add('hidden');
      document.getElementById('tela-faceid').classList.remove('flex');
      document.getElementById('tela-menu').classList.remove('hidden');
      document.getElementById('tela-menu').classList.add('flex');
    }

    async function iniciarCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        document.getElementById("camera-feed").srcObject = cameraStream;
        document.getElementById('camera-placeholder').style.display = 'none';
        startFaceID();
      } catch (erro) {
        document.getElementById("status-text").innerText = "PERMISSÃO DE CÂMERA NEGADA";
      }
    }

    function startFaceID() {
      const status = document.getElementById('status-text');
      const container = document.getElementById('media-container');

      container.classList.add('scale-105');
      status.innerText = "ESCANEANDO ROSTO...";
      status.style.color = '#cc2b2b';
      status.classList.add('animate-pulse');

      setTimeout(() => {
        status.innerText = "ROSTO IDENTIFICADO";
        status.classList.remove('animate-pulse');
        status.style.color = 'rgb(22,163,74)';
        container.classList.remove('scale-105');
        container.classList.add('border-green-500');
        document.querySelector('.scanning-line').style.display = 'none';
        document.querySelector('.pulsing-ring').style.borderColor = 'rgba(34,197,94,0.3)';
      }, 3000);
    }
  </script>

</body>
</html>
