<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecteca - Celular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6 text-center">

  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-sm flex flex-col items-center gap-6">

    <h1 class="text-2xl font-bold uppercase text-[#cc292b]">CONECTECA</h1>
    <p class="text-gray-500 text-sm">Toque no livro com o celular e clique no botão abaixo</p>

    <div class="animate-pulse bg-blue-100 h-28 w-28 rounded-full flex items-center justify-center">
      <span class="text-5xl">📚</span>
    </div>

    <p class="text-base font-medium text-gray-700" id="status">Aguardando...</p>

    <!-- Botão manual para disparar o evento -->
    <button onclick="enviarSinal()"
      class="bg-[#cc292b] text-white w-full py-4 rounded-xl text-lg font-bold uppercase hover:opacity-90 transition border-none cursor-pointer">
      LIBERAR LIVRO
    </button>

    <!-- Leitura NFC automática (apenas Android Chrome) -->
    <button onclick="iniciarNFC()"
      class="bg-gray-800 text-white w-full py-3 rounded-xl text-base font-semibold uppercase hover:opacity-90 transition border-none cursor-pointer">
      ATIVAR NFC AUTOMÁTICO
    </button>

  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabase = createClient(
      'gjigayvnwgobagwtzkrl',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqaWdheXZud2dvYmFnd3R6a3JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMTE0MDksImV4cCI6MjA5NTY4NzQwOX0.AvRtYGBtnumkgCM1Svefxbihb5XyWBmHqiXQooicBKU'
    );

    const canal = supabase.channel('sala-conecteca');
    canal.subscribe();

    const status = document.getElementById('status');

    // Botão manual — dispara o evento no Supabase
    window.enviarSinal = async function() {
      status.innerText = "Enviando sinal...";
      status.style.color = "gray";

      const { error } = await canal.send({
        type: 'broadcast',
        event: 'liberar',
        payload: { mensagem: 'livro liberado' }
      });

      if (error) {
        status.innerText = "❌ Erro ao enviar: " + error.message;
        status.style.color = "red";
      } else {
        status.innerText = "✅ Sinal enviado! Notebook deve redirecionar.";
        status.style.color = "green";
      }
    }

    // NFC automático (funciona apenas no Android com Chrome)
    window.iniciarNFC = async function() {
      if (!('NDEFReader' in window)) {
        status.innerText = "❌ NFC não suportado neste navegador. Use Chrome no Android.";
        status.style.color = "red";
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        status.innerText = "📡 NFC ativo. Aproxime do livro...";
        status.style.color = "blue";

        ndef.onreading = () => {
          status.innerText = "📚 Livro detectado! Enviando sinal...";
          window.enviarSinal();
        };

        ndef.onerror = () => {
          status.innerText = "❌ Erro ao ler NFC.";
          status.style.color = "red";
        };

      } catch (err) {
        status.innerText = "❌ Permissão NFC negada: " + err.message;
        status.style.color = "red";
      }
    }
  </script>

</body>
</html>
